{% extends 'base/base.html' %}
{% load static %}
{% block head %}
    <head>
       <link rel="stylesheet" href="{% static 'rpg/styles/criar_rpg.css' %}?v=1.2">
    </head>
{% endblock %}

{% block content %}
    <div class="page-shell">
        <div class="card" id="criar-rpg-card">
            <h1>Criar RPG</h1>
            <form method="post">
                {% csrf_token %}
                <div class="form-fields">
                    {{ form.as_p }}
                </div>
                <div class="form-actions">
                    <button type="submit" class="action-button">Criar RPG</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
